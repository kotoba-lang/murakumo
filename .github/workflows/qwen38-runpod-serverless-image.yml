name: Build Qwen3.8 RunPod Serverless image

on:
  push:
    branches:
      - codex/260821g-runpod-serverless-modal
    paths:
      - .github/workflows/qwen38-runpod-serverless-image.yml
      - tools/runpod-serverless-bench/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: tools/runpod-serverless-bench
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kotoba-lang/murakumo-qwen38-runpod-serverless:260821g-v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
