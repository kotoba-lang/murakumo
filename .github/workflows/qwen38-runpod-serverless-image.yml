name: Build Qwen3.8 RunPod Serverless image

on:
  push:
    branches:
      - codex/260821g-runpod-serverless-modal
    paths:
      - .github/workflows/qwen38-runpod-serverless-image.yml
      - tools/runpod-serverless-bench/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: tools/runpod-serverless-bench
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kotoba-lang/murakumo-qwen38-runpod-serverless:260821g-v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
