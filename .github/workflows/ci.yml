name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kotoba-operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Public compile/run uses the Release kotoba CLI. Language pin is
      # kotoba-lang@b19e0586 (b19e058603e30a0ea8f6f8b4ec8c5622d4371a16,
      # kotoba-lang.pin.edn). This job does not claim the language pin
      # compiled artifacts. There is no kotoba -M and no clojure -M start.
      - name: Install Release kotoba CLI
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/kotoba-linux-amd64.tar.gz \
            "https://github.com/kotoba-lang/kotoba/releases/download/v0.7.3/kotoba-linux-amd64.tar.gz"
          tar -xzf /tmp/kotoba-linux-amd64.tar.gz -C /tmp
          bin=$(find /tmp -type f -name kotoba | head -n 1)
          test -n "$bin"
          install -m 755 "$bin" "$HOME/.local/bin/kotoba"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.local/bin/kotoba"
      - name: kotoba compile (wasm and web)
        run: sh scripts/kotoba-compile.sh
      - name: prove artifacts exist before any emit claim
        run: |
          set -eu
          for name in desired factory quic_driver quic_cert; do
            test -s "target/kotoba/${name}.wasm"
            test -s "target/kotoba/${name}.mjs"
            echo "bytes ${name}.wasm=$(wc -c < target/kotoba/${name}.wasm)"
            echo "bytes ${name}.mjs=$(wc -c < target/kotoba/${name}.mjs)"
          done
      - name: guest run (instantiateKotoba + exports)
        run: sh scripts/kotoba-run.sh
      - name: Linux kexe-verify is HOLD (exit 78, not fake ok)
        run: |
          set +e
          sh scripts/amu-native.sh kotoba/desired.kotoba
          test $? -eq 78
