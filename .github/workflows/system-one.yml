name: System One

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  system-one-offline:
    # System One Coding through the pinned kotoba-lang/kotoba-harness:
    # project shape, typed catalog, stage dependencies and baseline splice,
    # plus the harness's offline search tests. No kotoba verification and no
    # model call (those need a kotoba CLI with -M, amu's browser host and
    # OpenRouter credit).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install nbb
        run: npm install -g nbb@1.4.208
      - name: Validate system-one/gateway.edn
        run: sh scripts/system-one.sh validate
      - name: kotoba-harness offline search tests
        run: cd "$(sh scripts/system-one.sh home)" && nbb -cp src:test test/run.cljs
